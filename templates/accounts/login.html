{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="form-narrow card">
  <h1>Sign in</h1>
  <form method="post" novalidate>{% csrf_token %}
    {% if form.non_field_errors %}<div class="alert error">{{ form.non_field_errors.0 }}</div>{% endif %}
    {% for field in form %}{% include "_field.html" %}{% endfor %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  <p class="muted" style="margin-top:1rem">New here? <a href="{% url 'accounts:register' %}">Create a free account</a></p>
</div>
{% endblock %}
