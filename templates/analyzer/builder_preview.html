{% extends "base.html" %}
{% block title %}{{ r.title }}{% endblock %}
{% block content %}
<div class="no-print">
  <div class="row between" style="margin-bottom:1rem">
    <div class="row">
      <span class="muted">Template:</span>
      {% for k in keys %}<a class="btn sm {% if k == t %}primary{% endif %}" href="?t={{ k }}">{{ k|title }}</a>{% endfor %}
    </div>
    <div class="row">
      <button class="btn sm primary" onclick="window.print()">Print / Save as PDF</button>
      <a class="btn sm" href="{% url 'analyzer:builder_docx' r.pk %}">Download DOCX</a>
      <a class="btn sm" href="{% url 'analyzer:builder_edit' r.pk %}">Edit</a>
      <form class="inline" method="post" action="{% url 'analyzer:builder_analyze' r.pk %}">{% csrf_token %}<button class="btn sm">Score this resume</button></form>
    </div>
  </div>
  <p class="muted"><small>Tip: in the print dialog, choose "Save as PDF" and turn off headers and footers.</small></p>
</div>
{% include tpl %}
{% endblock %}
